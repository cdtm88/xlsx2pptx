name: Check tools

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The committed .html files must be exactly what the sources build to
      - name: Built files are up to date
        run: python3 framework/build.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      # Opens every tool over file://: CSP present, no network, no errors, main flow works
      - name: Smoke test
        run: node tests/smoke.cjs
